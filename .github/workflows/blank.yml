name: Build & Release Windows Miner

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install MinGW-w64 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 binutils-mingw-w64-x86-64

      - name: Compile Native Windows Binary
        run: |
          x86_64-w64-mingw32-g++ -std=c++17 -O3 -ffast-math -mconsole -pthread -static -static-libgcc -static-libstdc++ client_window.cpp -o miner.exe
          x86_64-w64-mingw32-strip --strip-all miner.exe

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoMiner-Windows-x64
          path: miner.exe

      - name: Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: miner.exe
          name: Release ${{ github.ref_name }}
          body: |
            ### Native Windows Release (${{ github.ref_name }})
            - **Instructions:** Place `miner.exe` inside `%USERPROFILE%\Desktop\crypto_miner\` before running it for the first time.
            - **Zero Dependencies:** Statically linked (`-static -mconsole`), no external DLLs required.
          draft: false
          prerelease: false
